[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-forecast"
version = "0.1.0"
description = "Manufacturing demand & production forecasting dashboard (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36,<2.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    # Auth: argon2id password hashes (pwdlib, the maintained successor to passlib) and JWTs.
    "pwdlib[argon2]>=0.3.1",
    "PyJWT>=2.15",
    # Pinned exactly: for a given seed the generator must reproduce ground_truth.json
    # and the sampled history byte-for-byte. NumPy does not guarantee Generator streams
    # across versions, and a holidays release can move a festival date.
    "numpy==2.5.3",
    "holidays==0.106",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]  # starlette.testclient prefers httpx2 over httpx
# Phase-5 forecasting stack, pinned exactly (like numpy and holidays): forecasts are
# byte-identical only for the same versions, and each run records them. Verified to
# install and fit on Python 3.14 / Windows in the project venv.
ml = ["prophet==1.5.0", "cmdstanpy==1.3.0", "lightgbm==4.7.0", "statsmodels==0.15.0", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
